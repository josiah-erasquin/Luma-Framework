name: Build Metaphor addon only

on:
  push:
    branches: [ metaphor-api-check ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - uses: microsoft/setup-msbuild@v1.1.2
    - name: Integrate vcpkg with MSBuild
      shell: pwsh
      run: '& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" integrate install'
    - name: Build Metaphor ReFantazio (Publishing-Release x64)
      shell: pwsh
      run: msbuild "Source\Games\Metaphor ReFantazio\Metaphor ReFantazio.vcxproj" /m /p:Configuration=Publishing-Release /p:Platform=x64 /p:SolutionDir="$PWD\" /p:SolutionName=Luma /p:DefineConstants="REMOTE_BUILD=1"
    - name: List output
      shell: pwsh
      run: Get-ChildItem -Recurse -Filter "Luma-*.addon" -ErrorAction SilentlyContinue | Select-Object FullName, Length
    - uses: actions/upload-artifact@v4
      with:
        name: Luma-Metaphor-apicheck
        path: "**/Luma-Metaphor*.addon"
        if-no-files-found: error
